name: Deploy app to GitHub Pages
# Runs on every push that changes app/ or vm-image/ (or manually: Actions → this workflow → Run workflow)
#
# Besides the app it publishes the disk of the in-browser Linux (app/public/vm/):
# vm-image/build-rootfs.sh (Debian 12 i386 + exam packages; mmdebstrap with the
# runner's 64-bit apt, then offline i386 chroot steps) -> vm-image/build-ext2.sh
# -> ext2 -> 128 KiB chunks in dist/vm/disk/ (same format as leaningtech/webvm,
# read by CheerpX.GitHubDevice). Nothing 32-bit touches the network: the
# runner's kernel has no 32-bit socket syscalls (i386 docker builds can't
# download anything there).
# The disk is cached by the hash of vm-image/**, so it is rebuilt only when that
# folder changes. If building it fails, the site is still deployed and the VM page
# falls back to WebVM's public Debian disk.

on:
  push:
    branches: [main, master, claude/lucid-darwin-jey0v9]
    paths: ['app/**', 'vm-image/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

      # ---- Linux VM disk (optional: any failure here only disables our disk) ----
      - name: VM disk - cache
        id: vmcache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: vm-disk
          key: vm-disk-v1-${{ hashFiles('vm-image/**') }}
      - name: VM disk - build image (mmdebstrap i386 + offline chroot) and split into chunks
        if: steps.vmcache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          VM_VERSION: ${{ hashFiles('vm-image/**') }}
          ROOTFS: ${{ runner.temp }}/vm-rootfs
        run: |
          fail() {
            echo "::error title=VM disk build failed::$1 - the site is deployed without our disk; /vm/ falls back to WebVM's public disk."
            exit 1
          }
          sudo apt-get update -qq || fail "apt-get update on the runner failed"
          sudo apt-get install -y -qq mmdebstrap debian-archive-keyring \
            || fail "could not install mmdebstrap"
          mmdebstrap --version
          ok=0
          for i in 1 2 3; do
            sudo rm -rf "$ROOTFS"
            if sudo bash vm-image/build-rootfs.sh "$ROOTFS"; then ok=1; break; fi
            echo "::warning::VM rootfs build attempt $i failed, retrying"
            sleep 15
          done
          [ "$ok" = 1 ] || fail "vm-image/build-rootfs.sh failed 3 times (see the log above)"
          bash vm-image/build-ext2.sh "$ROOTFS" vm-disk "$VM_VERSION" || fail "vm-image/build-ext2.sh failed"
          sudo rm -rf "$ROOTFS"
      - name: VM disk - add to site
        continue-on-error: true
        run: |
          if [ ! -f vm-disk/manifest.json ]; then
            echo "::warning title=VM disk missing::No VM disk this run; the /vm/ page will use WebVM's public disk."
            exit 0
          fi
          mkdir -p app/dist/vm/disk
          cp vm-disk/* app/dist/vm/disk/
          site_mb=$(du -sm app/dist | cut -f1)
          echo "VM disk: $(tr -d '\n ' < vm-disk/manifest.json)"
          echo "Site size with VM disk: ${site_mb} MiB"
          if [ "$site_mb" -gt 980 ]; then
            echo "::warning title=Site too big::${site_mb} MiB > GitHub Pages 1 GB limit; publishing without the VM disk."
            rm -rf app/dist/vm/disk
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
